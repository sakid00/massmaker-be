# VPS2: API + Postgres + Caddy (80/443). Frontend is a separate compose on network massmaker.
#   docker network create massmaker   # once, before first up
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Point DNS A/AAAA for $MASSMAKER_DOMAIN and api.$MASSMAKER_DOMAIN at this VPS.
# Set ENMASSE_INTERNAL_URL=https://internal.api.enmasse.id in .env.
# Do not start a second Caddy from massmaker-fe.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: massmaker
    ports:
      - "127.0.0.1:5480:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d massmaker"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: "8080"
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/massmaker?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      MASSMAKER_DOMAIN: ${MASSMAKER_DOMAIN:-massmaker.id}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - app
      - massmaker

  # Daily makers → Google Sheets (profile cluster on the same tab).
  # Opt-in: --profile pg2sheet. See README.md.
  pg2sheet:
    profiles: [pg2sheet]
    build:
      context: ./jobs/pg2sheet
    container_name: pg2sheet
    restart: unless-stopped
    environment:
      TZ: UTC
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: massmaker
      PG_USER: postgres
      PG_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # Required when using --profile pg2sheet (compose still interpolates inactive profiles).
      SHEET_ID: ${PG2SHEET_SHEET_ID:-}
      SHEET_TAB: ${PG2SHEET_SHEET_TAB:-makers}
      GOOGLE_CREDS_FILE: /secrets/creds.json
    volumes:
      - ${PG2SHEET_CREDS_FILE:-./secrets/pg2sheet-creds.json}:/secrets/creds.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - app

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  app:
  massmaker:
    name: massmaker
    external: true
