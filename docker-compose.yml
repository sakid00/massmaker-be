# Local: API + Postgres. Caddy is not used here.
#   docker compose up --build -d
# Or run the API on the host: docker compose up -d postgres && go run ./cmd/api
#
# If the API runs in Docker and Enmasse is on the host, set
# ENMASSE_INTERNAL_URL=http://host.docker.internal:8081
#
# VPS: use docker-compose.prod.yml instead.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: massmaker
    ports:
      - "5480:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d massmaker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "8080"
      APP_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/massmaker?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
